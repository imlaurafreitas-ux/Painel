<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Meu Painel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap"><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#d2cec5;--card:#fff;--tx:#0e1618;--mu:#4a5b5e;--bd:#c3beb3;--ac:#2b454a;--on:#f2e400;--ok:#9ec5c4;--lk:#2b454a;--rd:#b3470f;--hd:#2b454a;--sh:0 1px 0 rgba(43,69,74,.08);--f:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17282b;--card:#243c41;--tx:#f4f6f5;--mu:#a9bfc0;--bd:#38555b;--ac:#f2e400;--on:#000;--ok:#9ec5c4;--lk:#f2e400;--rd:#f5a162;--hd:#1d3337;--sh:none}}
:root[data-theme="dark"]{--bg:#17282b;--card:#243c41;--tx:#f4f6f5;--mu:#a9bfc0;--bd:#38555b;--ac:#f2e400;--on:#000;--ok:#9ec5c4;--lk:#f2e400;--rd:#f5a162;--hd:#1d3337;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased}
main{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
:focus-visible{outline:3px solid #f2e400;outline-offset:2px}
.top{background:var(--hd);color:#fff;border-bottom:4px solid #f2e400;position:sticky;top:0;z-index:5}
.hd{position:relative;overflow:hidden;padding:18px 16px 10px}
.hd::after{content:"";position:absolute;right:0;top:0;bottom:0;width:min(34vw,260px);background:#f2e400;clip-path:polygon(100% 0,100% 100%,0 100%)}
.hd::before{content:"";position:absolute;right:min(34vw,260px);top:0;bottom:0;width:min(10vw,70px);background:#9ec5c4;opacity:.35;clip-path:polygon(100% 0,100% 100%,0 100%)}
.top h1{position:relative;z-index:1;margin:0 auto;max-width:1008px;display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.lg{width:26px;height:22px;background:#f2e400;clip-path:polygon(0 0,100% 0,0 100%);display:inline-block;flex:none}
.top .st{color:#9ec5c4;font-weight:500;font-size:12px;letter-spacing:0}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1040px;margin:0 auto;padding:0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;border:0;background:none;color:#c9d6d6;font:600 14px var(--f);padding:12px 12px 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-4px;transition:color .15s,border-color .15s}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:#f2e400}
h1{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi,.box{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:14px 16px;box-shadow:var(--sh)}
.kpi{position:relative;overflow:hidden;padding-top:16px}
.kpi::after{content:"";position:absolute;right:0;top:0;width:26px;height:26px;background:#f2e400;clip-path:polygon(0 0,100% 0,100% 100%)}
.kpi b{display:block;font-size:38px;line-height:1;font-weight:800;letter-spacing:-.03em;color:var(--tx)}
.kpi span{display:block;margin-top:6px;color:var(--mu);font-size:13px;font-weight:500}
.kpi.bad b{color:var(--rd)}
.box{margin-bottom:14px}
.box h3{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--tx);letter-spacing:-.01em}
.li{padding:9px 0;border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.li:first-of-type{border:0;padding-top:0}
.li small{color:var(--mu)}.late{color:var(--rd);font-weight:600}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
input,select{padding:9px 10px;border:1px solid var(--bd);border-radius:4px;background:var(--card);color:var(--tx);font:inherit;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.add{background:var(--ac);color:var(--on);border:0;border-radius:4px;padding:9px 14px;cursor:pointer;font:700 14px var(--f);transition:filter .15s}
.add:hover{filter:brightness(1.15)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:6px}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;font-weight:600;color:var(--mu);background:rgba(43,69,74,.06)}
td[contenteditable]{min-width:90px}td select,td input{width:100%}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px;padding:0 4px}.x:hover{color:var(--rd)}
.bar{display:flex;gap:8px;margin:22px 0 0}.bar button{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:4px;padding:7px 12px;cursor:pointer;font:600 12px var(--f)}.bar button:hover{border-color:var(--ac);color:var(--tx)}
textarea{width:100%;min-height:76px;padding:10px;border:1px solid var(--bd);border-radius:4px;background:var(--card);color:var(--tx);font:inherit;resize:vertical}.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.ai{white-space:pre-wrap}.st{color:var(--mu);font-size:12px}
.empty{color:var(--mu);padding:10px 0}
a{color:var(--lk);font-weight:600;text-decoration-color:#f2e400;text-decoration-thickness:2px;text-underline-offset:3px}
.cc{background:var(--card);border:1px solid var(--bd);border-left:5px solid #f2e400;border-radius:6px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}.ch{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.ch>div:first-child{flex:1;min-width:0}.ch b{font-size:17px;font-weight:700;letter-spacing:-.01em}.pg{text-align:right;font-size:12px;font-weight:600;color:var(--mu);min-width:84px}.pg u{display:block;height:8px;background:var(--bd);border-radius:2px;margin-top:5px;text-decoration:none;overflow:hidden}.pg i{display:block;height:100%;background:#f2e400;transition:width .3s}
.stp{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:6px;margin:12px 0}.s{display:flex;flex-direction:column;gap:2px;border:1px solid var(--bd);border-radius:4px;padding:9px;cursor:pointer;position:relative;transition:background .15s}.s input{position:absolute;right:8px;top:8px;width:auto;accent-color:#2b454a}.s span{font-weight:600;padding-right:22px;font-size:13px}.s small{color:var(--mu);font-size:11px;min-height:14px}
.s.ok{background:var(--ok);border-color:var(--ok);color:#11191b}.s.ok small{color:#2b454a}.s.nx{border:2px solid #f2e400;padding:8px}.ob{font-size:13px;color:var(--mu)}[contenteditable]:empty:before{content:attr(data-ph);color:var(--mu);opacity:.6}
.flt{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.flt button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:4px;padding:6px 12px;cursor:pointer;font:600 13px var(--f)}.flt button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.tk{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:12px;margin-bottom:6px;cursor:pointer;transition:background .15s}.tk:hover{border-color:var(--ac)}.tk input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:#2b454a}.tk b{display:block;font-size:14px;font-weight:600}.tk small{color:var(--mu)}.tk.dn{opacity:.5}.tk.dn b{text-decoration:line-through}.tg{font-size:12px;font-weight:600;padding:2px 8px;border-radius:3px;background:var(--ok);color:#11191b;margin-left:auto;white-space:nowrap}.tg.a{background:#f2e400}.tg.m{background:var(--bd)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}.cw{font-size:12px;font-weight:600;color:var(--mu);text-align:center;padding-bottom:2px}.cd{background:var(--card);border:1px solid var(--bd);border-radius:4px;min-height:58px;padding:5px;cursor:pointer;overflow:hidden;transition:border-color .15s}.cd:hover{border-color:var(--ac)}.cd.em{background:none;border:0;cursor:default}.cd b{font-size:13px;font-weight:700}.cd.td{background:#f2e400;border-color:#f2e400;color:#000}.cd.sl{background:var(--ac);border-color:var(--ac);color:var(--on)}.cd.td.sl{box-shadow:0 0 0 3px var(--ac)}.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.dt{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px #2b454a}.dt.t{background:#f2e400}.dt.t.lt{box-shadow:0 0 0 2px #b3470f}.dt.a{background:#9ec5c4}.dt.d{background:#f5a162}.dt.n{background:#d2cec5}.cd.sl .dt,.cd.td .dt{box-shadow:0 0 0 1px #fff}
.ch2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.ch2 h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1}.ch2 button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:4px;padding:6px 14px;cursor:pointer;font:600 14px var(--f)}.ch2 button:hover{border-color:var(--ac)}.lg2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:12px}.lg2 span{display:flex;align-items:center;gap:6px}.dr{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.dr label,.dl{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:500;color:var(--mu)}

body{--tc:#fff;--tt:#0e1618;transition:background .25s;background:color-mix(in srgb,var(--bg) 88%,var(--tc) 12%)}
body[data-tab=tasks]{--tc:#f5a162;--tt:#000}
body[data-tab=contr]{--tc:#9ec5c4;--tt:#000}
body[data-tab=cal]{--tc:#4f7378;--tt:#fff}
body[data-tab=emp]{--tc:#8a8272;--tt:#fff}
body[data-tab=leads]{--tc:#f2e400;--tt:#000}
body[data-tab=mkt]{--tc:#000;--tt:#f2e400}
body[data-tab=cos]{--tc:#cfc9ba;--tt:#000}
nav button{margin-bottom:0;border-radius:6px 6px 0 0;border-bottom:0}
nav button.on{background:var(--tc);color:var(--tt);font-weight:700}
nav button:not(.on):hover{background:rgba(255,255,255,.08)}
.hd::before{background:var(--tc);opacity:.7;transition:background .25s}
#app::before{content:"";display:block;height:6px;border-radius:3px;background:var(--tc);margin-bottom:18px;box-shadow:0 0 0 1px rgba(43,69,74,.25)}
.fnl{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px;margin-bottom:10px}.fn{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--bd);border-radius:4px;padding:8px 10px;text-align:left;cursor:pointer;color:var(--tx);font-family:var(--f);transition:border-color .15s}.fn b{display:block;font-size:26px;line-height:1.1;font-weight:800}.fn span{font-size:12px;color:var(--mu);font-weight:500}.fn.on{background:var(--ac);color:var(--on);border-top-color:#f2e400}.fn.on span{color:var(--on)}.fn:hover{border-top-color:#f2e400}.tbr{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}@media(max-width:560px){.top h1{font-size:22px}.kpi b{font-size:32px}.cd{min-height:50px;padding:4px}main{padding:16px 12px 32px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header class="top"><div class="hd"><h1><i class="lg"></i>Meu Painel <span class="st" id="sy"></span></h1></div><nav id="nav"></nav></header><main>
<div id="app"></div>
<div class="bar"><button onclick="bk()">Copiar backup</button><button onclick="rs()">Restaurar backup</button></div>
</main>
<script>
const O=(...a)=>a;
const C={
tasks:{t:'Tarefas',f:[['titulo','Tarefa','text'],['prazo','Prazo','date'],['prio','Prioridade',O('Alta','Média','Baixa')],['status','Status',O('A fazer','Fazendo','Feito')]],done:'Feito'},
contr:{t:'Contractors',f:[['nome','Nome','text'],['cliente','Cliente / vaga','text'],['obs','Observação','text']]},
emp:{t:'Empresas',f:[['empresa','Empresa','text'],['novidade','Novidade','text'],['data','Data','date'],['acao','Ação / follow-up','text'],['link','Link','url']]},
leads:{t:'Leads',f:[['empresa','Empresa','text'],['gatilho','Gatilho Brunel',["1 Novo contrato/projeto", "2 Expansão no Brasil", "3 Novas contratações", "4 Novo FPSO/embarcação", "5 Mobilização de projeto", "6 Investimento/CAPEX", "7 Vitória em BID", "8 Falta de mão de obra", "9 M&A/JV", "10 Descomissionamento"]],['prio','Prioridade',['Alta','Média','Baixa']],['motivo','Por que é lead','text'],['estagio','Estágio',['Novo','Contatado','Proposta','Fechado','Perdido']],['passo','Próximo passo','text'],['contato','Contato','text'],['data','Data','date'],['link','Fonte','url']],done:'Fechado'},
mkt:{t:'Mercado',f:[['tema','Tema','text'],['nota','Notícia / insight','text'],['fonte','Fonte','text'],['data','Data','date'],['link','Link','url']]},
cos:{t:'Carteira',f:[['nome','Empresa','text'],['obs','Observação','text']]}};
let D={tasks:[],contr:[],emp:[],leads:[],mkt:[],cos:[]},tab='dash';
try{const s=localStorage.getItem('painel');if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
let dbd=null,ready=false,tm;
const save=()=>{try{localStorage.setItem('painel',JSON.stringify(D))}catch(e){}
if(dbd&&ready){clearTimeout(tm);tm=setTimeout(()=>dbd.set({j:JSON.stringify(D)}).catch(()=>{}),600)}};
(async()=>{try{const db=await claude.use('db');if(!db)return;dbd=db.doc('painel/main');const sn=await dbd.get();
if(sn.exists&&sn.data().j){D=Object.assign({tasks:[],contr:[],emp:[],leads:[],mkt:[],cos:[]},JSON.parse(sn.data().j));applySeed();try{localStorage.setItem('painel',JSON.stringify(D))}catch(e){}draw()}
ready=true;if(!sn.exists)save();sync(true)}catch(e){}})();
function sync(ok){const e=document.getElementById('sy');if(e)e.textContent=ok?'● sincronizado':''}
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=(()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())})();
const STEPS=[['contato','Contato'],['cs','CS'],['aprov','Email de aprovação'],['pl','PL'],['ht','HT'],['email','Envio email de PL']];
const nS=r=>STEPS.filter(([k])=>r.steps&&r.steps[k]).length,nm=r=>r.nome||r.quem||'';let cf='ab';
const fin=(k,r)=>k==='contr'?nS(r)===STEPS.length:C[k].done&&(r.status===C[k].done||r.estagio===C[k].done||r.estagio==='Perdido');
const fd=d=>d?d.split('-').reverse().join('/'):'';
function nav(){document.body.dataset.tab=tab;document.getElementById('nav').innerHTML=[['dash','Painel'],...Object.keys(C).flatMap(k=>k==='contr'?[[k,C[k].t],['cal','Calendário']]:[[k,C[k].t]])].map(([k,t])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${t}</button>`).join('')}
function go(k){tab=k;draw()}
function dash(){
const open=k=>D[k].filter(r=>!fin(k,r)),late=k=>open(k).filter(r=>r.prazo&&r.prazo<today);
const lst=(arr,a,b)=>arr.length?arr.map(r=>`<div class="li"><span>${E(r[a])}<br><small>${E(r[b])}</small></span><small class="${r.prazo&&r.prazo<today?'late':''}">${fd(r.prazo||r.data)}</small></div>`).join(''):'<div class="empty">Nada por aqui.</div>';
const recent=k=>[...D[k]].sort((a,b)=>(b.data||'').localeCompare(a.data||'')).slice(0,4);
const by=auto().filter(x=>bs(x)&&!x.done).slice(0,6).map(x=>({titulo:x.t,prio:x.s,data:x.d}));
const ct=open('contr').slice(0,6);
return`<div class="box"><h3>Entrada rápida: cole um e-mail, mensagem ou anotação</h3><textarea id="qi" placeholder="Ex.: João (contractor) pediu o relatório até sexta. A Acme lançou novo produto. Lead novo: Beta Ltda, falar com Ana."></textarea>
<div class="row"><button class="add" onclick="qi()">Organizar com Claude</button><button class="add" style="background:var(--mu)" onclick="sum()">Resumo do dia</button><span class="st" id="qs"></span></div><div class="ai" id="ai" style="margin-top:8px"></div></div>
<div class="grid">
<div class="kpi"><b>${auto().filter(x=>bs(x)&&!x.done).length}</b><span>Tarefas abertas</span></div>
<div class="kpi bad"><b>${late('tasks').length+late('contr').length}</b><span>Atrasadas</span></div>
<div class="kpi"><b>${open('contr').length}</b><span>Contractors em admissão</span></div>
<div class="kpi"><b>${open('leads').length}</b><span>Leads ativos</span></div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
<div class="box"><h3>Próximas tarefas</h3>${lst(by,'titulo','prio')}</div>
<div class="box"><h3>Esteira de admissão</h3>${ct.length?ct.map(r=>{const j=STEPS.findIndex(([k])=>!(r.steps&&r.steps[k]));return`<div class="li"><span>${E(nm(r))}<br><small>Próximo: ${STEPS[j][1]}</small></span><small>${nS(r)}/${STEPS.length}</small></div>`}).join(''):'<div class="empty">Nenhum em admissão.</div>'}</div>
${upc()}<div class="box"><h3>Leads por prioridade (gatilhos Brunel)</h3>${lst(open('leads').sort((a,b)=>'AMB'.indexOf((a.prio||'B')[0])-'AMB'.indexOf((b.prio||'B')[0])).slice(0,6),'empresa','gatilho')}</div>
<div class="box"><h3>Novidades das empresas</h3>${lst(recent('emp'),'empresa','novidade')}</div>
<div class="box"><h3>Mercado</h3>${lst(recent('mkt'),'tema','nota')}</div></div>`}
const IDLE=7,dd=d=>Math.round((new Date(today)-new Date(d))/864e5);
let cq='',cs='parado',sf='';
const nxt=r=>STEPS.findIndex(([k])=>!(r.steps&&r.steps[k]));
const lastAct=r=>{const v=Object.values(r.steps||{}).filter(Boolean).sort().pop();return v||r.criado||''};
const idle=r=>{const l=lastAct(r);return l?Math.max(0,dd(l)):0};
function cards(){
const q=cq.toLowerCase();
const L=D.contr.map((r,i)=>[r,i]).filter(([r])=>(cf==='all'||(cf==='ok')===fin('contr',r))&&(!q||(nm(r)+' '+(r.cliente||'')+' '+(r.obs||'')).toLowerCase().includes(q))&&(!sf||(nxt(r)>=0&&STEPS[nxt(r)][0]===sf)));
L.sort(([a],[b])=>cs==='nome'?nm(a).localeCompare(nm(b)):cs==='recente'?(lastAct(b)).localeCompare(lastAct(a)):idle(b)-idle(a));
return L.map(([r,i])=>{const n=nS(r),nx=nxt(r),id=idle(r);
return `<div class="cc"><div class="ch"><div><b contenteditable data-ph="Nome" onblur="up('contr',${i},'nome',this.innerText)">${E(nm(r))}</b><br><small contenteditable data-ph="Cliente / vaga" onblur="up('contr',${i},'cliente',this.innerText)">${E(r.cliente)}</small>${nx>=0&&id>IDLE?`<br><small class="late">parado há ${id} dias</small>`:''}</div><div class="pg"><span>${n}/${STEPS.length}</span><u><i style="width:${n/STEPS.length*100}%"></i></u></div><button class="x" title="Apagar" onclick="del('contr',${i})">✕</button></div><div class="dr"><label>Admissão<input type="date" value="${E(r.admissao||'')}" onchange="up('contr',${i},'admissao',this.value)"></label><label>Desligamento<input type="date" value="${E(r.deslig||'')}" onchange="up('contr',${i},'deslig',this.value)"></label></div><div class="stp">${STEPS.map(([k,l],j)=>{const d=r.steps&&r.steps[k];return `<label class="s ${d?'ok':j===nx?'nx':''}"><input type="checkbox" ${d?'checked':''} onchange="tg(${i},'${k}',this.checked)"><span>${j+1}. ${l}</span><small>${d?fd(d):j===nx?'próximo passo':''}</small></label>`}).join('')}</div><div class="ob" contenteditable data-ph="Observações" onblur="up('contr',${i},'obs',this.innerText)">${E(r.obs||r.demanda||'')}</div></div>`}).join('')||'<div class="empty">Nenhum contractor com esse filtro.</div>'}
function viewC(){
const form=`<form onsubmit="add(event,'contr')">${C.contr.f.map(([n,l])=>`<input name="${n}" placeholder="${l}">`).join('')}<label class="dl">Admissão<input type="date" name="admissao"></label><label class="dl">Desligamento<input type="date" name="deslig"></label><button class="add">+ Novo contractor</button></form>`;
if(!D.contr.length)return form+`<div class="box"><h3>Comece pelo primeiro contractor</h3><div class="ob" style="margin-bottom:10px">Cada contractor percorre a esteira abaixo. Marque uma etapa e a data é registrada; a próxima fica destacada.</div><div class="stp">${STEPS.map(([k,l],j)=>`<div class="s ${j===0?'nx':''}"><span>${j+1}. ${l}</span><small>${j===0?'começa aqui':''}</small></div>`).join('')}</div><div class="ob">Preencha nome e cliente no formulário acima e toque em "+ Novo contractor". Admissão e desligamento aparecem no Calendário.</div></div>`;
const ab=D.contr.filter(r=>nxt(r)>=0),okc=D.contr.length-ab.length;

let tf='p',ts='base',A=[];const bs=x=>x.src==='Contractor'||x.src==='Manual',inS=x=>ts==='base'?bs(x):x.src===ts;

function evs(d){D.cal=D.cal||[];const o=[];
D.tasks.forEach((r,i)=>{if(r.prazo===d)o.push({k:'t',t:r.titulo,done:r.status==='Feito',i})});

function upc(){D.cal=D.cal||[];const L=[];
